name: Drain email queue

# ENABLED. This is the project's only queue drainer.
#
# The alternative is pg_cron (supabase/optional/cron_schedule.sql), which is
# NOT part of the migrations and is not applied by setup.sql. Do not schedule
# it as well: two drainers means every email gets two attempts at once. To
# check nothing is scheduled in the database:
#
#   select jobname, schedule from cron.job;
#
# An error saying the cron schema does not exist is the clearest possible
# "nothing is scheduled".
#
# ---------------------------------------------------------------------------
# Secrets
# ---------------------------------------------------------------------------
# Settings -> Secrets and variables -> Actions
#
#   SUPABASE_PROJECT_REF   the subdomain of your Supabase URL. Not sensitive;
#                          it is in every request the site already makes.
#   DRAIN_SECRET           a long random string you generate, stored here AND
#                          in Supabase -> Project Settings -> Edge Functions
#                          -> Secrets under the same name.
#
# There is deliberately NO database key here. An earlier version of this file
# asked for SUPABASE_SERVICE_ROLE_KEY, and that was wrong: a repository secret
# is readable by every workflow in the repository and by anyone who can push
# one, and service_role bypasses every privacy rule in the database. Handing a
# cron job the ability to read every donor's phone number, so that it can ask
# for a queue to be emptied, is not a trade worth making.
#
# DRAIN_SECRET proves one thing: that the caller may ask for a drain. It opens
# no tables and decrypts nothing. If it leaks, the worst anyone can do is cause
# the queue to be sent, which is its purpose. Rotating it is changing one
# string in two places, with no redeploy.

on:
  schedule:
    # Every five minutes, the shortest interval GitHub accepts.
    #
    # Two things to know, both properties of GitHub rather than of this
    # workflow:
    #
    #   Scheduled runs are best-effort. GitHub delays them under load and the
    #   shortest intervals are hit hardest, so ten to fifteen minutes late is
    #   normal and a skipped run happens. Nothing is lost when one is missed:
    #   the queue is a queue, and the next run takes whatever is due.
    #
    #   GitHub disables scheduled workflows in public repositories after 60
    #   days with no commits. Mail would stop going out silently. If this
    #   repository ever goes quiet for two months, re-enable it in the Actions
    #   tab, or move to pg_cron, which has neither limitation.
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: drain-email-queue
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  drain:
    runs-on: ubuntu-latest
    steps:
      - name: Call drain-email-queue
        env:
          REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          DRAIN_SECRET: ${{ secrets.DRAIN_SECRET }}
        run: |
          if [ -z "$REF" ] || [ -z "$DRAIN_SECRET" ]; then
            echo "SUPABASE_PROJECT_REF and DRAIN_SECRET must both be set."
            echo "See the comment at the top of this file."
            exit 1
          fi

          # The function has verify_jwt = false, so there is no Authorization
          # header at all. DRAIN_SECRET is the only credential, and it is
          # checked in constant time inside the function.
          response=$(curl -sS -w '\n%{http_code}' -X POST \
            "https://${REF}.supabase.co/functions/v1/drain-email-queue" \
            -H "x-drain-secret: ${DRAIN_SECRET}" \
            -H "Content-Type: application/json" \
            -d '{}')

          body=$(echo "$response" | head -n -1)
          status=$(echo "$response" | tail -n 1)

          # The body reports how many were sent, failed and expired. It never
          # contains an email address.
          echo "HTTP $status"
          echo "$body"

          if [ "$status" = "200" ]; then
            exit 0
          fi

          # Setup not finished yet is an expected state, not a broken run. This
          # fires every five minutes; failing it before README section 3 is
          # done would mean a failure notification every five minutes for as
          # long as that takes, which trains everyone to ignore the ones that
          # matter. Warn instead, and start working on its own once the secrets
          # are in place.
          if echo "$body" | grep -q '"not_configured"'; then
            echo "::warning::Setup incomplete, so nothing was sent. The response says which secret is missing. See README section 3."
            exit 0
          fi

          # A wrong secret is not a setup problem, it is a real one: either
          # DRAIN_SECRET differs between here and Supabase, or something else
          # is calling this endpoint.
          if [ "$status" = "401" ]; then
            echo "::error::Rejected. DRAIN_SECRET here does not match the one in Supabase Edge Function secrets."
          fi

          exit 1
